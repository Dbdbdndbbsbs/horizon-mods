id = "bodymotion"
kind = "native-mod"
name = "Body Motion"
summary = """Smoother and more expressive third-person animations: eating, drinking, climbing, riding, maps, lanterns, petting and more, with a custom settings screen."""
description = """
Body Motion brings your character to life in third person with smooth, expressive animations for everyday actions.

What it does: • Eating, drinking, climbing, riding boats and horses, crawling, falling, burning, freezing, sleeping and elytra gliding all get natural poses. • Maps and lanterns render as real 3D models in your hands instead of flat icons, including filled maps in both hands. • Crouch next to a wolf or cat and your hand reaches out and follows the animal as it moves. • A crossbow aim limit and a configurable body rotation lock. • Sprinting, swimming and item swapping get their own animation set.

What's new: • Custom settings screen with tabs for Animations, Hold Up Items and Lanterns, with toggles, sliders, choices and item search. • 3D maps in both hands and 3D lanterns. • Petting that follows the animal with smooth aim. • Vanilla-friendly: a spear in use stays vanilla, and eating/drinking poses trigger only for real food and drink.
"""
